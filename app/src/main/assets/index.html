<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #container {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>
  <div id="container">
    <img id="zoom" src="calendar.jpg">
  </div>
  <script src="zoom.js"></script>
  <script>
    let zoomInstance = null;
    let saveTimer = null;
    let lastSavedState = null;

    function validState(state) {
      return state &&
        Array.isArray(state.A) && state.A.length === 2 &&
        state.A.every(row => Array.isArray(row) &&
          row.length === 2 && row.every(Number.isFinite)) &&
        Array.isArray(state.b) && state.b.length === 2 &&
        state.b.every(Number.isFinite);
    }

    function saveViewState() {
      if (saveTimer !== null) {
        clearTimeout(saveTimer);
        saveTimer = null;
      }
      if (!zoomInstance || typeof CalendarViewState === 'undefined') return;
      const transform = zoomInstance.resultantZoom;
      const state = { A: transform.A, b: transform.b };
      if (!validState(state)) return;
      const json = JSON.stringify(state);
      if (json === lastSavedState) return;
      try {
        CalendarViewState.saveState(json);
        lastSavedState = json;
      } catch (error) {
        console.warn('No se pudo guardar la vista', error);
      }
    }

    function scheduleSave() {
      if (saveTimer !== null) return;
      saveTimer = setTimeout(saveViewState, 150);
    }

    function restoreViewState() {
      if (typeof CalendarViewState === 'undefined') return;
      try {
        const json = CalendarViewState.getState();
        if (!json) return;
        const state = JSON.parse(json);
        if (!validState(state)) return;
        const transform = new Transform(state.A, state.b);
        zoomInstance.activeZoom = transform;
        zoomInstance.resultantZoom = transform;
        zoomInstance.repaint();
        lastSavedState = json;
      } catch (error) {
        console.warn('No se pudo restaurar la vista', error);
      }
    }

    function initZoom() {
      if (zoomInstance) return;
      const elem = document.getElementById('zoom');
      if (typeof Zoom === 'undefined' || !elem) return;
      if (!elem.complete) {
        elem.addEventListener('load', initZoom, { once: true });
        return;
      }
      if (elem.naturalWidth === 0) return;
      zoomInstance = new Zoom(elem, {
        rotate: true,
        minZoom: 0.5,
        maxZoom: 10
      });
      restoreViewState();
      const originalRepaint = zoomInstance.repaint;
      zoomInstance.repaint = function() {
        originalRepaint.call(this);
        scheduleSave();
      };
      zoomInstance.elemParent.addEventListener(
        'touchend', saveViewState, { passive: true }
      );
      zoomInstance.elemParent.addEventListener(
        'touchcancel', saveViewState, { passive: true }
      );
    }

    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'hidden') saveViewState();
    });
    window.addEventListener('pagehide', saveViewState);
    document.addEventListener('DOMContentLoaded', initZoom);
    if (document.readyState === 'interactive' || document.readyState === 'complete') {
      initZoom();
    }
  </script>
</body>
</html>
